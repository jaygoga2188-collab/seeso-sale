<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Payment successful</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f6f7fb;
    display:grid;
    place-items:center;
    min-height:100vh;
    color:#172033
}
.card{
    background:#fff;
    padding:40px 28px;
    border-radius:16px;
    text-align:center;
    max-width:360px;
    box-shadow:0 10px 35px #0002
}
.mark{
    font-size:52px;
    color:#16a34a
}
a{
    display:inline-block;
    margin-top:16px;
    background:#9f2089;
    color:#fff;
    padding:12px 20px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold
}
</style>

<!-- Facebook Pixel -->
<script>
!function(f,b,e,v,n,t,s)
{
if(f.fbq)return;
n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;
n.push=n;
n.loaded=!0;
n.version='2.0';
n.queue=[];
t=b.createElement(e);
t.async=!0;
t.src='https://connect.facebook.net/en_US/fbevents.js';
s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s);
}(window, document,'script');

fbq('init', '1695130584911579');
fbq('init', '1745711483408208');
fbq('trackSingle', '1695130584911579', 'PageView');
fbq('trackSingle', '1745711483408208', 'PageView');
</script>

<noscript>
<img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=1695130584911579&ev=PageView&noscript=1"/>
<img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=1745711483408208&ev=PageView&noscript=1"/>
</noscript>

</head>

<body>

<main class="card">
    <div class="mark">✓</div>
    <h1>Payment successful</h1>
    <p>Thank you. Your payment has been confirmed.</p>
    <a href="/">Continue shopping</a>
</main>

<script>
let verifiedPayment = null;
try { verifiedPayment = JSON.parse(sessionStorage.getItem("razorpay_verified_payment") || "null"); } catch (_) {}
if (!verifiedPayment?.verified) {
    location.replace("/failed.html");
} else {
    localStorage.removeItem("nexshop_cart");
    if (!sessionStorage.getItem("purchase_tracked")) {
        const purchase = { value: Number(verifiedPayment.amount) || 0, currency: verifiedPayment.currency || 'INR', content_type: 'product', content_ids: [verifiedPayment.reference || verifiedPayment.paymentId], num_items: 1 };
        fbq('trackSingle', '1695130584911579', 'Purchase', purchase);
        fbq('trackSingle', '1745711483408208', 'Purchase', purchase);
        sessionStorage.setItem("purchase_tracked", "true");
    }
}
</script>

</body>
</html>
